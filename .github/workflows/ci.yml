name: CI

# Autoridade dos gates (docs/SDLC.md, ADR 0024). Os hooks locais sao conveniencia; aqui tudo e refeito do zero.
on:
  pull_request:
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  gates:
    # G1-G8, G12, G16 (G13 e G9/G10 entram nas trilhas P1/P2)
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt -r bridge/requirements.txt pip-audit==2.10.1
      - name: G8 acoes fixadas por hash
        run: python scripts/gates/workflow_pins.py
      - name: G6 lint e formato dos arquivos Python alterados
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA..$HEAD_SHA" -- '*.py')
          NEW=$(git diff --name-only --diff-filter=A "$BASE_SHA..$HEAD_SHA" -- '*.py')
          if [ -n "$FILES" ]; then
            python -m ruff check --config scripts/gates/ruff.toml $FILES
          fi
          if [ -n "$NEW" ]; then
            python -m ruff format --check --config scripts/gates/ruff.toml $NEW
          fi
      - name: G5 segredos em cada commit do intervalo
        run: python scripts/gates/secret_scan.py "$BASE_SHA" "$HEAD_SHA"
      - name: G1-G4 e G12 em cada commit do intervalo
        run: python scripts/gates/ci_range.py range "$BASE_SHA" "$HEAD_SHA"
      - name: G7 testes Python com cobertura
        run: |
          python -m coverage run --branch --source=bridge,scripts/gates -m pytest -q
          python -m coverage json -o coverage.json
      - name: G7 cobertura das linhas novas e ramos da politica
        run: python scripts/gates/diff_coverage.py "$BASE_SHA" "$HEAD_SHA" coverage.json
      - name: G7 testes da skill (Node)
        working-directory: skill/lambda
        run: |
          npm ci
          npm test
      - name: G8 vulnerabilidades conhecidas
        run: |
          python -m pip_audit
          cd skill/lambda && npm audit --audit-level=high

  tests:
    # G14: matriz de sistemas e versoes
    if: github.event_name != 'pull_request_review'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -r bridge/requirements.txt
      - run: python -m pytest -q

  human-approval:
    # G11 e G15 (parte humana): caminhos protegidos e sensiveis exigem um dono humano que nao seja o autor
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Aprovacoes humanas e arquivos protegidos
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          APPROVERS=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate \
            | jq -rs 'add | map(select(.state=="APPROVED" or .state=="CHANGES_REQUESTED" or .state=="DISMISSED"))
                          | group_by(.user.login) | map(last) | map(select(.state=="APPROVED").user.login) | join(",")')
          PR_APPROVERS="$APPROVERS" python scripts/gates/ci_range.py approvals "$BASE_SHA" "$HEAD_SHA"

  evidencia:
    # G16: o PR precisa trazer a secao "Evidencia" com saida de comando real
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Secao Evidencia preenchida
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: python scripts/gates/evidence.py
