name: CI

# Autoridade dos gates (docs/SDLC.md, ADR 0024). Os hooks locais sao conveniencia; aqui tudo e refeito do zero.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  HEAD_SHA: ${{ github.sha }}

jobs:
  base:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.interval.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: interval
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$BRANCH" = main ]; then
            if [ "$EVENT" = push ]; then base="$BEFORE"; else base="$(git rev-parse HEAD^)"; fi
          else
            git merge-base --is-ancestor refs/remotes/origin/main "$HEAD_SHA"
            base="$(git rev-parse refs/remotes/origin/main)"
          fi
          git cat-file -e "$base^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

  gates:
    # G1-G8 (G13 e G9/G10 entram nas trilhas P1/P2)
    needs: base
    env:
      BASE_SHA: ${{ needs.base.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt -e . -c constraints.txt pip-audit==2.10.1
      - name: G8 acoes fixadas por hash
        if: ${{ !cancelled() }}
        run: python scripts/gates/workflow_pins.py
      - name: G6 lint das linhas alteradas e formato dos arquivos novos
        if: ${{ !cancelled() }}
        run: python scripts/gates/lint.py "$BASE_SHA" "$HEAD_SHA"
      - name: G5 segredos em cada commit do intervalo
        if: ${{ !cancelled() }}
        run: python scripts/gates/secret_scan.py "$BASE_SHA" "$HEAD_SHA"
      - name: G1-G4 em cada commit do intervalo
        if: ${{ !cancelled() }}
        run: python scripts/gates/ci_range.py range "$BASE_SHA" "$HEAD_SHA"
      - name: G7 testes Python com cobertura
        if: ${{ !cancelled() }}
        run: |
          python -m coverage run --branch --source=src/heycode,scripts/gates,scripts/ops -m pytest -q
          python -m coverage json -o coverage.json
      - name: G7 cobertura das linhas novas e ramos da politica
        if: ${{ !cancelled() }}
        run: python scripts/gates/diff_coverage.py "$BASE_SHA" "$HEAD_SHA" coverage.json
      - name: G7 testes da skill (Node)
        if: ${{ !cancelled() }}
        working-directory: skill/lambda
        run: |
          npm ci
          npm test
      - name: G8 vulnerabilidades conhecidas
        if: ${{ !cancelled() }}
        run: |
          python -m pip_audit
          cd skill/lambda && npm audit --audit-level=high

  tests:
    # G14: matriz de sistemas e versoes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -e . -c constraints.txt
      - run: python -m pytest -q

  evidencia:
    # G16: registra automaticamente os resultados do CI para este SHA.
    if: always()
    needs: [gates, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Registrar resultados dos gates e testes
        env:
          GATES_RESULT: ${{ needs.gates.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: python scripts/gates/evidence.py

  instalacao-limpa:
    # Meta da P1: roda recem-construida, em ambiente virtual novo, sem editar nada a mao, em ate 5 minutos
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Construir a roda
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          python -m pip install build==1.6.1
          python -m build --wheel
      - name: Instalar so a roda em ambiente virtual novo e conferir
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install -c constraints.txt dist/*.whl
          if [ "$RUNNER_OS" = "Windows" ]; then
            export HEYCODE_HOME="$USERPROFILE/heycode-ci-$GITHUB_RUN_ID"
          else
            export HEYCODE_HOME="$RUNNER_TEMP/heycode-home"
          fi
          "$BIN/heycode" --version
          "$BIN/python" -c "from heycode.templates import template_root; print(template_root())"
          "$BIN/heycode" init
          PORT=18765
          "$BIN/heycode" serve --port "$PORT" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs "http://127.0.0.1:$PORT/health" && break; sleep 1; done
          BRIDGE_URL="http://127.0.0.1:$PORT" "$BIN/heycode" doctor --json > "$RUNNER_TEMP/doctor.json" || true
          cat "$RUNNER_TEMP/doctor.json"
          DOCTOR_JSON="$RUNNER_TEMP/doctor.json" "$BIN/python" - <<'PY'
          import json, os, sys

          checks = {c["name"]: c for c in json.load(open(os.environ["DOCTOR_JSON"], encoding="utf-8"))}
          required = ["python", "diretorio", "segredos", "ponte", "autenticação"]
          bad = {n: checks[n]["detail"] for n in required if checks[n]["status"] != "ok"}
          sys.exit(f"doctor com problema nas camadas obrigatorias: {bad}" if bad else 0)
          PY
          ELAPSED=$(( $(date +%s) - START ))
          echo "instalacao limpa em ${ELAPSED}s"
          [ "$ELAPSED" -lt 300 ]
      - name: Log da ponte (diagnostico)
        if: failure()
        run: cat "$RUNNER_TEMP/serve.log" || true
